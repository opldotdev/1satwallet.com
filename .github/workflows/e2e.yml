name: E2E

# Browser tests driven by agent-browser.
#
# testnet: builds this commit, serves it with `next start` on the runner and
# runs the spending tests against http://localhost:3000 as a throwaway
# testnet wallet (secrets of the "e2e-testnet" environment). Runs on PRs to
# main from this repository, nightly, and by hand.
#
# production: read-only checks of https://1satwallet.com as a new visitor,
# with no wallet and no secrets. Runs after each Vercel Production deploy,
# nightly, and by hand.

on:
  pull_request:
    branches: [main]
  deployment_status:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testnet:
    name: Testnet (local build)
    # Fork PRs get no secrets, so they skip this job instead of failing it.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' || (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: e2e-testnet
    # One wallet, one writer: runs queue instead of spending wallet A's coins
    # at the same time, and a queued run is never cancelled.
    concurrency:
      group: e2e-testnet-wallet
      cancel-in-progress: false
    env:
      E2E_BASE_URL: http://localhost:3000
      # Nightly, yesterday's one-block lock must have matured and unlock.
      E2E_REQUIRE_UNLOCK: ${{ github.event_name == 'schedule' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install Chrome for agent-browser
        run: bunx agent-browser install --with-deps

      - name: Backend reachability
        run: bun run test:live

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_API_HOST: https://api.1sat.app
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud
          NEXT_PUBLIC_ONESAT_STACK_URL: https://api.1sat.app
          NEXT_PUBLIC_ORDFS_URL: https://api.1sat.app
          NEXT_PUBLIC_WALLET_STORAGE_URL: https://wallet.1sat.app

      - name: Start the app
        run: |
          bun run start > next-start.log 2>&1 &
          if ! curl --silent --show-error --fail --output /dev/null \
            --retry 60 --retry-delay 1 --retry-connrefused --retry-all-errors \
            "$E2E_BASE_URL/"; then
            cat next-start.log
            exit 1
          fi

      - name: Browser tests
        run: bun run e2e
        env:
          E2E_WALLET_A_BACKUP: ${{ secrets.E2E_WALLET_A_BACKUP }}
          E2E_WALLET_PASSPHRASE: ${{ secrets.E2E_WALLET_PASSPHRASE }}

      - name: Server log
        if: failure()
        run: cat next-start.log

      # Screenshots are taken only after the passphrase field is cleared.
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-testnet-screenshots
          path: e2e-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7

  production:
    name: Production (read-only)
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' || (
        github.event_name == 'deployment_status' &&
        github.event.deployment_status.state == 'success' &&
        github.event.deployment.creator.login == 'vercel[bot]' &&
        github.event.deployment.environment == 'Production'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: https://1satwallet.com
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install Chrome for agent-browser
        run: bunx agent-browser install --with-deps

      - name: Read-only browser tests
        run: bun run e2e:mainnet

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-production-screenshots
          path: e2e-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
