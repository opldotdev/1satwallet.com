name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Report dependency drift
        run: bun outdated
      - run: bun audit
      - run: bunx biome check .
      - name: No fixed sleeps in e2e tests
        run: |
          if grep -rn "waitForTimeout" e2e/; then
            echo "::error::e2e tests must wait on app state, not time (page.waitForTimeout is banned)."
            exit 1
          fi
      - run: bunx tsc --noEmit
      - run: bun test
      - run: bun scripts/check-routes.mjs
      - name: Build production app
        run: bun run build
        env:
          NEXT_PUBLIC_API_HOST: https://api.1sat.app
          NEXT_PUBLIC_APP_URL: https://1satwallet.com
          NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud
          NEXT_PUBLIC_ONESAT_STACK_URL: https://api.1sat.app
          NEXT_PUBLIC_ORDFS_URL: https://api.1sat.app
          NEXT_PUBLIC_WALLET_STORAGE_URL: https://wallet.1sat.app
